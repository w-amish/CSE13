<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>Restaurant Gallery</title>
  <style>
  body {
    margin: 0;
    font-family: Arial;
    background: #f4f4f4;
   }

  h1 {
    text-align: center;
    padding: 20px;
   }

   .gallery {
     display: flex;
     flex-wrap: wrap;
     justify-content: center;
      gap: 15px;
      padding: 20px;
        }

    .gallery img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
     }

     @media (max-width: 600px) {
      .gallery img {
        width: 100%;
        height: auto;
        }
      }
    </style>
</head>

<body>

<h1>Food Gallery</h1>
